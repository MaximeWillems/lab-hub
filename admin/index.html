<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin — PIKIlab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <link rel="stylesheet" href="/lab.css">
</head>
<body>
  <main class="wide">
    <header>
      <h1>PIKI<span class="lab">lab</span> · admin</h1>
    </header>

    <div class="panel topbar">
      <p class="muted">Connecté en tant que <strong id="who">…</strong></p>
      <div class="actions">
        <a class="btn" href="/">← Voir le hub</a>
        <a class="btn" href="/logout">Se déconnecter</a>
      </div>
    </div>

    <div class="section-head">
      <h2>Cartes du hub</h2>
      <button class="btn btn-primary" id="btn-new" type="button">+ Nouvelle carte</button>
    </div>

    <div class="grid" id="cards"></div>
  </main>

  <footer>pikilab.app — fait maison par PIKI 🧪</footer>

  <!-- Fenêtre d'ajout / modification d'une carte -->
  <dialog id="editor">
    <form class="editor" id="editor-form" novalidate>
      <h2 id="editor-title">Nouvelle carte</h2>

      <div class="editor-body">
        <div class="editor-form">
          <div class="title-row">
            <div class="field">
              <span>Emoji</span>
              <button class="emoji-btn" id="emoji-btn" type="button" aria-expanded="false" title="Choisir un emoji">🧪</button>
            </div>

            <label class="field">
              <span class="field-head">Titre <span class="counter" id="count-title"></span></span>
              <input name="title" id="f-title" maxlength="60" placeholder="Mon projet" required>
            </label>
          </div>

          <div class="emoji-pop" id="emoji-pop" hidden>
            <emoji-picker locale="fr"
              data-source="https://cdn.jsdelivr.net/npm/emoji-picker-element-data@1.8.0/fr/emojibase/data.json"></emoji-picker>
          </div>

          <label class="field">
            <span class="field-head">Description <span class="counter" id="count-desc"></span></span>
            <textarea name="description" id="f-desc" maxlength="200" rows="3"
              placeholder="Une phrase pour présenter le projet."></textarea>
          </label>

          <label class="field">
            <span>Lien</span>
            <input name="url" id="f-url" placeholder="monprojet.pikilab.app" required>
          </label>

          <p class="error" id="editor-error" hidden></p>
        </div>

        <div class="preview-side">
          <span class="label">Aperçu sur le hub</span>
          <div class="card" id="preview">
            <span class="emoji"></span>
            <h2></h2>
            <p></p>
            <span class="url"></span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-danger" id="btn-delete" type="button" hidden>Supprimer</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-cancel" type="button">Annuler</button>
        <button class="btn btn-primary" type="submit">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const dialog = $("editor");
    const picker = document.querySelector("emoji-picker");

    // Sélecteur d'emoji chargé à part : s'il ne charge pas, le reste de l'admin marche quand même
    let pickerReady = false;
    Promise.all([
      import("https://cdn.jsdelivr.net/npm/emoji-picker-element@1.29.1/index.js"),
      import("https://cdn.jsdelivr.net/npm/emoji-picker-element@1.29.1/i18n/fr.js")
    ]).then(([, fr]) => {
      picker.i18n = fr.default;
      pickerReady = true;
    }).catch(() => {});

    let cards = [];
    let editing = null; // carte en cours de modification, null pour une nouvelle
    let emoji = "🧪";

    fetch("/api/me").then((res) => res.json()).then((me) => { $("who").textContent = me.user; });

    // ---------- Liste des cartes ----------

    async function loadCards() {
      cards = await (await fetch("/api/cards")).json();
      renderCards();
    }

    function renderCards() {
      const grid = $("cards");
      grid.innerHTML = "";

      if (!cards.length) {
        grid.innerHTML = '<p class="empty muted">Aucune carte. Clique sur « + Nouvelle carte » pour commencer.</p>';
        return;
      }

      cards.forEach((card, i) => {
        const el = buildCard(document.createElement("div"), card);
        el.classList.add("admin-card");
        el.title = "Modifier";
        el.onclick = () => openEditor(card);

        const tools = document.createElement("div");
        tools.className = "card-tools";
        tools.append(
          tool("✏️ Modifier", "edit", () => openEditor(card)),
          tool("↑", "", () => move(i, -1), i === 0, "Monter"),
          tool("↓", "", () => move(i, 1), i === cards.length - 1, "Descendre")
        );
        el.append(tools);
        grid.append(el);
      });
    }

    function tool(label, className, action, disabled = false, title = "") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `btn ${className}`;
      btn.textContent = label;
      btn.title = title;
      btn.disabled = disabled;
      btn.onclick = (event) => { event.stopPropagation(); action(); };

      return btn;
    }

    // Remplit une carte avec le même rendu que sur le hub (textContent : aucun HTML interprété)
    function buildCard(el, card) {
      el.className = "card";
      el.innerHTML = '<span class="emoji"></span><h2></h2><p></p><span class="url"></span>';
      el.querySelector(".emoji").textContent = card.emoji || "🧪";
      el.querySelector("h2").textContent = card.title || "Titre du projet";
      el.querySelector("p").textContent = card.description || "";
      el.querySelector(".url").textContent = shortUrl(card.url) || "monprojet.pikilab.app";

      return el;
    }

    function shortUrl(link) {
      if (!link) return "";

      try {
        const u = new URL(/^https?:\/\//i.test(link) ? link : `https://${link}`);
        return (u.host + u.pathname).replace(/\/$/, "");
      } catch {
        return link;
      }
    }

    // Échange la carte avec sa voisine puis enregistre le nouvel ordre
    async function move(index, delta) {
      const target = index + delta;
      [cards[index], cards[target]] = [cards[target], cards[index]];
      renderCards();

      const res = await api("POST", "/api/cards/order", { ids: cards.map((c) => c.id) });
      if (!res.ok) toast("Impossible d'enregistrer l'ordre");

      loadCards();
    }

    // ---------- Fenêtre d'édition ----------

    function openEditor(card) {
      editing = card || null;
      $("editor-title").textContent = card ? "Modifier la carte" : "Nouvelle carte";
      $("btn-delete").hidden = !card;
      $("editor-error").hidden = true;

      setEmoji(card ? card.emoji : "🧪");
      $("f-title").value = card ? card.title : "";
      $("f-desc").value = card ? card.description : "";
      $("f-url").value = card ? shortUrl(card.url) : "";

      closePicker();
      updatePreview();
      dialog.showModal();
      $("f-title").focus();
    }

    function setEmoji(value) {
      emoji = value || "🧪";
      $("emoji-btn").textContent = emoji;
      updatePreview();
    }

    function updatePreview() {
      buildCard($("preview"), {
        emoji,
        title: $("f-title").value.trim(),
        description: $("f-desc").value.trim(),
        url: $("f-url").value.trim()
      });
      $("count-title").textContent = `${$("f-title").value.length}/60`;
      $("count-desc").textContent = `${$("f-desc").value.length}/200`;
    }

    ["f-title", "f-desc", "f-url"].forEach((id) => $(id).addEventListener("input", updatePreview));

    // Sélecteur d'emoji
    function closePicker() {
      $("emoji-pop").hidden = true;
      $("emoji-btn").setAttribute("aria-expanded", "false");
    }

    $("emoji-btn").onclick = () => {
      if (!pickerReady) {
        const typed = prompt("Emoji de la carte :", emoji);
        if (typed) setEmoji(typed.trim());
        return;
      }

      const open = $("emoji-pop").hidden;
      $("emoji-pop").hidden = !open;
      $("emoji-btn").setAttribute("aria-expanded", String(open));
    };

    picker.addEventListener("emoji-click", (event) => {
      setEmoji(event.detail.unicode);
      closePicker();
    });

    // Clic en dehors du sélecteur : on le ferme ; clic sur le fond sombre : on ferme la fenêtre
    dialog.addEventListener("click", (event) => {
      if (!$("emoji-pop").hidden && !event.target.closest("#emoji-pop, #emoji-btn")) closePicker();
      if (event.target === dialog) dialog.close();
    });

    dialog.addEventListener("cancel", (event) => {
      if ($("emoji-pop").hidden) return;

      event.preventDefault(); // Échap ferme d'abord le sélecteur, pas toute la fenêtre
      closePicker();
    });

    $("btn-cancel").onclick = () => dialog.close();

    $("editor-form").onsubmit = async (event) => {
      event.preventDefault();

      const body = {
        emoji,
        title: $("f-title").value,
        description: $("f-desc").value,
        url: $("f-url").value
      };
      const res = editing
        ? await api("PUT", `/api/cards/${editing.id}`, body)
        : await api("POST", "/api/cards", body);

      if (!res.ok) {
        $("editor-error").textContent = (await res.json()).error || "Enregistrement impossible.";
        $("editor-error").hidden = false;
        return;
      }

      dialog.close();
      toast(editing ? "Carte modifiée ✅" : "Carte ajoutée ✅");
      loadCards();
    };

    $("btn-delete").onclick = async () => {
      if (!confirm(`Supprimer « ${editing.title} » du hub ?`)) return;

      const res = await api("DELETE", `/api/cards/${editing.id}`);
      if (!res.ok) {
        $("editor-error").textContent = "Suppression impossible.";
        $("editor-error").hidden = false;
        return;
      }

      dialog.close();
      toast("Carte supprimée");
      loadCards();
    };

    $("btn-new").onclick = () => openEditor(null);

    // ---------- Outils ----------

    function api(method, path, body) {
      return fetch(path, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined
      });
    }

    let toastTimer;
    function toast(message) {
      $("toast").textContent = message;
      $("toast").hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { $("toast").hidden = true; }, 2500);
    }

    loadCards();
  </script>
</body>
</html>
