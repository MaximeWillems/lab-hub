<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin — PIKIlab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <style>
    :root {
      --bg: #f6f7f9;
      --bg-card: #ffffff;
      --text: #1a1d21;
      --text-muted: #5c6470;
      --border: #e2e5ea;
      --shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 4px 14px rgba(0, 0, 0, .05);
      --accent: #6366f1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --bg-card: #181b21;
        --text: #e8eaed;
        --text-muted: #9aa3af;
        --border: #262a32;
        --shadow: 0 1px 3px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
        --accent: #818cf8;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 3.5rem 1.25rem 2rem;
    }

    header { text-align: center; margin-bottom: 2rem; }

    header h1 {
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -.02em;
    }

    header h1 .lab { color: var(--accent); }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .who { color: var(--text-muted); }
    .who strong { color: var(--text); }

    .soon {
      color: var(--text-muted);
      font-size: .9rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .actions { display: flex; gap: .75rem; flex-wrap: wrap; }

    .btn {
      font: inherit;
      font-weight: 600;
      font-size: .9rem;
      text-decoration: none;
      border-radius: 10px;
      padding: .6rem 1rem;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn:hover { border-color: var(--accent); }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>PIKI<span class="lab">lab</span> · admin</h1>
    </header>

    <div class="panel">
      <p class="who" id="who">Vérification de la connexion…</p>

      <p class="soon">Bientôt ici : ajouter, modifier et retirer les cartes du hub.</p>

      <div class="actions">
        <a class="btn" href="/">← Retour au hub</a>
        <a class="btn" href="/cdn-cgi/access/logout">Se déconnecter</a>
      </div>
    </div>
  </main>

  <footer>pikilab.app — fait maison par PIKI 🧪</footer>

  <script>
    // Cloudflare Access donne l'identité de la personne connectée sur cette URL
    fetch("/cdn-cgi/access/get-identity")
      .then((res) => (res.ok ? res.json() : Promise.reject()))
      .then((id) => {
        const who = document.getElementById("who");
        who.textContent = "Connecté en tant que ";
        const strong = document.createElement("strong");
        strong.textContent = id.email || id.name || "PIKI";
        who.appendChild(strong);
      })
      .catch(() => {
        document.getElementById("who").textContent =
          "Connexion non détectée : la protection Cloudflare Access n'est pas encore active.";
      });
  </script>
</body>
</html>
