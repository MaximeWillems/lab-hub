<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Connexion — PIKIlab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <link rel="stylesheet" href="/lab.css">
</head>
<body>
  <main>
    <header>
      <h1>PIKI<span class="lab">lab</span> · connexion</h1>
    </header>

    <form class="panel" method="POST" action="/login/">
      <p class="error" id="error" hidden>Pseudo ou mot de passe incorrect.</p>

      <label class="field">
        <span>Pseudo</span>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>

      <label class="field">
        <span>Mot de passe</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>

      <input type="hidden" name="next" id="next" value="/">

      <div class="actions">
        <button class="btn btn-primary" type="submit">Se connecter</button>
        <a class="btn" href="/">← Retour au hub</a>
      </div>

      <p class="muted">Pas encore de compte ? <a href="/signup/">Créer un compte</a></p>
    </form>
  </main>

  <footer>pikilab.app — fait maison par PIKI 🧪</footer>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.has("erreur")) document.getElementById("error").hidden = false;
    if (params.get("next")) document.getElementById("next").value = params.get("next");
  </script>
</body>
</html>
